<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이중진자 실험실</title>
  <style>
    :root { --ink:#eaf0ff; --muted:#9ba9c5; --line:#263553; --panel:#101a2e; --blue:#70b5ff; --coral:#ff8a72; --bg:#07101f; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 20%,#172c50 0%,var(--bg) 47%);font-family:Inter,ui-sans-serif,system-ui,"Apple SD Gothic Neo",sans-serif;color:var(--ink)}
    .app{max-width:1280px;margin:auto;padding:28px;display:grid;grid-template-columns:310px 1fr;gap:24px} header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:end} h1{margin:0;font-size:28px;letter-spacing:-.05em} header p{margin:7px 0 0;color:var(--muted);font-size:14px}.tag{color:#a7d3ff;border:1px solid #315982;border-radius:99px;padding:7px 11px;font-size:12px}
    .panel,.stage{background:linear-gradient(145deg,rgba(20,33,57,.95),rgba(10,18,35,.93));border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.panel{padding:20px}.group{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line)}.group:last-of-type{border:0;margin:0}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#b9c9e8;margin:0 0 13px}.field{display:grid;grid-template-columns:1fr 91px;gap:10px;align-items:center;margin:10px 0}.field label{font-size:13px;color:var(--muted)}input{width:100%;appearance:none;background:#091326;border:1px solid #30415f;border-radius:8px;color:var(--ink);padding:8px;font:inherit;font-size:13px;outline-color:var(--blue)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}button{cursor:pointer;border:0;border-radius:9px;padding:11px 9px;font:600 13px inherit;background:#223350;color:var(--ink);transition:.15s}button:hover{filter:brightness(1.18)}button.primary{background:linear-gradient(135deg,#438fe4,#6e65e7)}button.wide{grid-column:1/-1;background:#274568}.hint{font-size:12px;line-height:1.55;color:var(--muted);margin:15px 0 0}
    .stage{padding:14px;min-width:0}.canvas-wrap{position:relative;aspect-ratio:1.35;min-height:440px;overflow:hidden;border-radius:11px;background:#060d1a}canvas{display:block;width:100%;height:100%}.legend{position:absolute;left:16px;bottom:14px;display:flex;gap:13px;color:#cbd8ee;font-size:12px;background:rgba(6,13,26,.7);padding:7px 9px;border-radius:7px}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px}.readout{position:absolute;right:16px;top:14px;font:12px ui-monospace,monospace;color:#aab9d6;background:rgba(6,13,26,.7);padding:8px 10px}.records{margin:16px 4px 3px}.records-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.records h2{margin:0}.records button{padding:6px 9px;font-size:11px}.record-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}.empty{color:var(--muted);font-size:12px;margin:4px 0}.record{position:relative;display:block;border:1px solid #2b405f;border-radius:8px;overflow:hidden;background:#091326;text-decoration:none;color:#b7c6e2}.record img{display:block;width:100%;aspect-ratio:1.5;object-fit:cover}.record time{display:block;font-size:10px;padding:6px}.record button{position:absolute;right:4px;top:4px;padding:2px 6px;background:rgba(7,16,31,.82)}
    @media(max-width:780px){.app{padding:16px;grid-template-columns:1fr}header{align-items:start;gap:12px}.tag{white-space:nowrap}.canvas-wrap{min-height:330px}}
select{width:100%;background:#091326;border:1px solid #30415f;border-radius:8px;color:var(--ink);padding:8px;font:inherit;font-size:13px}</style>
</style><style>.user-gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,9,19,.84);backdrop-filter:blur(8px)}.user-card{width:min(360px,calc(100vw - 32px));padding:28px;border:1px solid #365279;border-radius:18px;background:#101a2e;box-shadow:0 28px 80px rgba(0,0,0,.45)}.user-card h2{font-size:22px;letter-spacing:-.04em;text-transform:none;color:var(--ink)}.user-card p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 17px}.user-card input{margin-bottom:10px}.user-card button{width:100%;background:linear-gradient(135deg,#438fe4,#6e65e7)}.record .author{display:block;padding:6px 6px 0;font-size:11px;font-weight:700;color:#dce9ff}</style></head>
<body>
  <div class="user-gate" id="userGate"><form class="user-card" id="userForm"><h2>이중진자 실험실</h2><p>궤적 기록에 표시할 사용자명을 입력해 주세요.</p><input id="username" maxlength="20" autocomplete="nickname" placeholder="사용자명" required autofocus><button type="submit">시뮬레이터 시작</button></form></div>
  <main class="app">
    <header><div><h1>이중진자 실험실</h1><p>작은 차이가 만들어내는 예측 불가능한 궤적</p></div><span class="tag" id="state">● 실행 중</span></header>
    <section class="panel">
      <div class="group"><h2>진자 1</h2><div class="field"><label for="l1">길이 <small>(px)</small></label><input id="l1" type="number" value="160" min="30" max="400"></div><div class="field"><label for="m1">질량 <small>(kg)</small></label><input id="m1" type="number" value="20" min="0.1" step="0.1"></div><div class="field"><label for="a1">초기 각도 <small>(°)</small></label><input id="a1" type="number" value="120" step="1"></div></div>
      <div class="group"><h2>진자 2</h2><div class="field"><label for="l2">길이 <small>(px)</small></label><input id="l2" type="number" value="100" min="30" max="400"></div><div class="field"><label for="m2">질량 <small>(kg)</small></label><input id="m2" type="number" value="10" min="0.1" step="0.1"></div><div class="field"><label for="a2">초기 각도 <small>(°)</small></label><input id="a2" type="number" value="300" step="1"></div></div>
      <div class="group"><h2>환경</h2><div class="field"><label for="g">중력 <small>(m/s²)</small></label><input id="g" type="number" value="10" min="0" max="100" step="0.1"></div><div class="field"><label for="speed">초기 속도</label><input id="speed" type="number" value="5" step="0.1"></div><div class="field"><label for="simSpeed">시뮬레이션 속도</label><select id="simSpeed"><option value="0.5">0.5배속</option><option value="1" selected>1배속</option><option value="2">2배속</option><option value="4">4배속</option></select></div></div>
      <div class="buttons"><button class="primary" id="toggle">일시정지</button><button id="reset">설정 적용 / 초기화</button><button id="clear">궤적 지우기</button><button class="wide" id="save">궤적 PNG로 저장</button></div>
      <p class="hint">설정 적용 시 새로운 조건으로 시뮬레이션을 시작합니다. 캔버스를 클릭해도 일시정지/재생할 수 있습니다.</p>
    </section>
    <section class="stage"><div class="canvas-wrap"><canvas id="canvas"></canvas><div class="readout" id="readout"></div><div class="legend"><span><i class="dot" style="background:#ff8a72"></i>진자 1</span><span><i class="dot" style="background:#70b5ff"></i>진자 2 궤적</span></div></div><div class="records"><div class="records-head"><h2>궤적 기록 보관함</h2><button id="clearRecords">기록 전체 삭제</button></div><div class="record-list" id="recordList"></div></div></section>
  </main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, orderBy, query, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyA4Fwgomv2_Rn39NQ_zSFagxbYSQtdOy_w',authDomain:'double-pendulum-records.firebaseapp.com',projectId:'double-pendulum-records',storageBucket:'double-pendulum-records.firebasestorage.app',messagingSenderId:'940770592991',appId:'1:940770592991:web:7d03e096fca442ca95c16a',measurementId:'G-NC084JN150'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),recordCollection=collection(db,'trajectoryRecords');
const canvas=document.querySelector('#canvas'), ctx=canvas.getContext('2d'), trail=document.createElement('canvas'), tctx=trail.getContext('2d');
let W,H,dpr, running=false, time=0, s={}, E0=0, view={x:0,y:0,l1:0,l2:0}, username='',userId='';
const $=id=>document.getElementById(id), n=id=>Number($(id).value);
function fitView(){if(!s.l1)return;const reach=s.l1+s.l2,margin=36,scale=Math.min((W-margin*2)/(reach*2),(H-margin*2)/(reach*2));view={x:W/2,y:H/2,l1:s.l1*scale,l2:s.l2*scale}}
function resize(){const r=canvas.getBoundingClientRect();dpr=devicePixelRatio||1; W=r.width;H=r.height;for(const c of [canvas,trail]){c.width=W*dpr;c.height=H*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}draw();}
function reset(){resize();s={l1:n('l1'),l2:n('l2'),m1:n('m1'),m2:n('m2'),g:n('g')*1000,a1:n('a1')*Math.PI/180,a2:n('a2')*Math.PI/180,v1:n('speed'),v2:n('speed')};time=0;E0=energy(s);fitView();tctx.clearRect(0,0,W,H);draw();}
function pos(){const {x,y,l1,l2}=view;return {x,y,x1:x+l1*Math.sin(s.a1),y1:y+l1*Math.cos(s.a1),x2:x+l1*Math.sin(s.a1)+l2*Math.sin(s.a2),y2:y+l1*Math.cos(s.a1)+l2*Math.cos(s.a2)}}
function derivative(q){let {m1,m2,l1,l2,g}=s,{a1,a2,v1,v2}=q,d=2*m1+m2-m2*Math.cos(2*a1-2*a2);let av1=(-g*(2*m1+m2)*Math.sin(a1)-m2*g*Math.sin(a1-2*a2)-2*Math.sin(a1-a2)*m2*(v2*v2*l2+v1*v1*l1*Math.cos(a1-a2)))/(l1*d);let av2=(2*Math.sin(a1-a2)*(v1*v1*l1*(m1+m2)+g*(m1+m2)*Math.cos(a1)+v2*v2*l2*m2*Math.cos(a1-a2)))/(l2*d);return {a1:v1,a2:v2,v1:av1,v2:av2};}
function plus(q,k,h){return {a1:q.a1+k.a1*h,a2:q.a2+k.a2*h,v1:q.v1+k.v1*h,v2:q.v2+k.v2*h};}
function step(){const factor=Number($('simSpeed').value),segments=Math.max(4,Math.round(4*factor)),h=.016*factor/segments;for(let j=0;j<segments;j++){const old=pos();let q={a1:s.a1,a2:s.a2,v1:s.v1,v2:s.v2},k1=derivative(q),k2=derivative(plus(q,k1,h/2)),k3=derivative(plus(q,k2,h/2)),k4=derivative(plus(q,k3,h));for(const key of ['a1','a2','v1','v2'])s[key]=q[key]+h*(k1[key]+2*k2[key]+2*k3[key]+k4[key])/6;const next=pos();tctx.strokeStyle='rgba(112,181,255,.54)';tctx.lineWidth=1.35;tctx.beginPath();tctx.moveTo(old.x2,old.y2);tctx.lineTo(next.x2,next.y2);tctx.stroke();}time+=.016*factor;}
function energy(q){let {m1,m2,l1,l2,g}=s,{a1,a2,v1,v2}=q;let kinetic=.5*m1*l1*l1*v1*v1+.5*m2*(l1*l1*v1*v1+l2*l2*v2*v2+2*l1*l2*v1*v2*Math.cos(a1-a2));let potential=-(m1+m2)*g*l1*Math.cos(a1)-m2*g*l2*Math.cos(a2);return kinetic+potential;}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#060d1a';ctx.fillRect(0,0,W,H);ctx.drawImage(trail,0,0,W,H);if(!s.l1)return;let p=pos();ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#8195bd';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x1,p.y1);ctx.lineTo(p.x2,p.y2);ctx.stroke();ctx.fillStyle='#dce9ff';ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill();ctx.fillStyle='#ff8a72';ctx.beginPath();ctx.arc(p.x1,p.y1,Math.max(8,Math.sqrt(s.m1)*3),0,7);ctx.fill();ctx.fillStyle='#70b5ff';ctx.beginPath();ctx.arc(p.x2,p.y2,Math.max(8,Math.sqrt(s.m2)*3),0,7);ctx.fill();let e=energy(s), drift=E0?((e-E0)/Math.abs(E0)*100):0;$('readout').textContent=`${username?'사용자  '+username+'\n':''}${username?'서울  '+seoulTime()+'\n':''}t  ${time.toFixed(1)} s\nE  ${e.toFixed(2)}\nΔE ${drift.toExponential(2)} %`;}
function loop(){if(running&&s.l1)step();draw();requestAnimationFrame(loop)}
function toggle(){running=!running;$('toggle').textContent=running?'일시정지':'재생';$('state').textContent=running?'● 실행 중':'Ⅱ 일시정지';}
function seoulTime(){return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'medium',timeStyle:'medium',hour12:false}).format(new Date())}
function renderRecords(items){const list=$('recordList');list.innerHTML='';if(!items.length){list.innerHTML='<p class="empty">아직 저장된 궤적이 없습니다.</p>';return}items.forEach(item=>{const card=document.createElement('a');card.className='record';card.href=item.image;card.download=item.filename||'double-pendulum-trail.jpg';const image=document.createElement('img');image.src=item.image;image.alt='저장된 이중진자 궤적';const date=document.createElement('time');date.textContent=`${item.koreaTime} · ${item.username}`;card.append(image,date);if(item.ownerId===userId){const remove=document.createElement('button');remove.type='button';remove.setAttribute('aria-label','기록 삭제');remove.textContent='×';remove.onclick=async e=>{e.preventDefault();await deleteDoc(doc(db,'trajectoryRecords',item.id))};card.append(remove)}list.append(card)})}
function watchRecords(){onSnapshot(query(recordCollection,orderBy('createdAt','desc'),limit(20)),snapshot=>renderRecords(snapshot.docs.map(d=>({id:d.id,...d.data()}))),error=>alert(`기록 보관함을 불러오지 못했습니다: ${error.message}`))}
async function saveTrail(){const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const o=out.getContext('2d');o.fillStyle='#060d1a';o.fillRect(0,0,out.width,out.height);o.drawImage(trail,0,0);const data=out.toDataURL('image/png'),name=`double-pendulum-trail-${Date.now()}.png`;const a=document.createElement('a');a.download=name;a.href=data;a.click();const thumb=document.createElement('canvas'),tw=Math.min(560,out.width);thumb.width=tw;thumb.height=Math.round(out.height*tw/out.width);thumb.getContext('2d').drawImage(out,0,0,thumb.width,thumb.height);try{await addDoc(recordCollection,{username,ownerId:userId,koreaTime:seoulTime(),createdAt:serverTimestamp(),filename:name,image:thumb.toDataURL('image/jpeg',.82)})}catch(error){alert(`웹 기록을 저장하지 못했습니다: ${error.message}`)}}
$('userForm').onsubmit=e=>{e.preventDefault();username=$('username').value.trim();if(!username)return;if(!userId){alert('Firebase 연결 중입니다. 잠시 후 다시 시도해 주세요.');return}$('userGate').remove();running=true};$('toggle').onclick=toggle;$('reset').onclick=reset;$('clear').onclick=()=>{tctx.clearRect(0,0,W,H);draw()};$('save').onclick=saveTrail;$('clearRecords').onclick=()=>alert('공유 기록은 본인이 저장한 항목의 × 버튼으로 삭제할 수 있습니다.');canvas.onclick=toggle;reset();loop();
signInAnonymously(auth).then(credential=>{userId=credential.user.uid;watchRecords()}).catch(error=>{alert(`Firebase 인증에 실패했습니다: ${error.message}`)});
</script>
</body></html>
